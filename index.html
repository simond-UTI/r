
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>2H</title><style>@import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap');html,body{height:100%;margin:0;padding:0;background:#13151a;font-family:'Roboto Mono',monospace;font-size:12px;line-height:1;color:#fff;overflow-x:hidden}*{box-sizing:border-box}.top{display:flex;align-items:center;gap:24px;padding:10px 16px}.logo{font-size:14px;font-weight:600;color:#fff;white-space:nowrap}.ts{font-size:12px;color:#fff}select{background:transparent;border:none;outline:none;font-family:'Roboto Mono',monospace;font-size:12px;color:#fff;cursor:pointer;-webkit-appearance:none}select option{background:#13151a;color:#fff}.sr{margin-left:auto}.sr input{background:transparent;border:none;outline:none;border-bottom:1px solid rgba(255,255,255,0.25);font-family:'Roboto Mono',monospace;font-size:12px;color:#fff;width:160px;padding:2px 0}.sr input::placeholder{color:rgba(255,255,255,0.4)}.sr input:focus{border-bottom-color:#fff}.sb{display:flex;gap:0;padding:4px 16px;border-bottom:1px solid rgba(255,255,255,0.12)}.sp{font-size:11px;color:#fff;cursor:pointer;padding:3px 20px 3px 0;border-bottom:2px solid transparent;white-space:nowrap}.sp:hover{opacity:0.7}.sp.on{border-bottom-color:#fff}.sp.ghc{color:#00e676!important;border-bottom-color:#00e676}.sp.gxt{color:#ff1744!important;border-bottom-color:#ff1744}.sp.gmo{border-bottom-color:#fff}.wrap{overflow-x:auto;overflow-y:auto;height:calc(100vh - 64px);-webkit-overflow-scrolling:touch}table{border-collapse:separate;border-spacing:0;width:max-content}thead{position:sticky;top:0;background:#13151a;z-index:10}tr.gh>th{font-size:11px;font-weight:600;color:#fff!important;letter-spacing:0.12em;text-transform:uppercase;padding:5px 12px 5px 0;text-align:left;background:#13151a;cursor:default;white-space:nowrap;border:none}tr.gh>th.blank{padding:0}tr.gh>th:first-child{padding-left:16px}tr.gh>th.gend{padding-right:32px!important}td.gsep{padding-left:24px!important}tr.ch>th.gsep{padding-left:24px!important}tr.gh>th.gsep{padding-left:24px!important}td.gsep-lg{padding-left:36px!important}tr.ch>th.gsep-lg{padding-left:36px!important}tr.gh>th.gsep-lg{padding-left:36px!important}tr.ch>th{font-size:12px;font-weight:600;color:#fff!important;padding:4px 12px 5px 0;text-align:left!important;background:#13151a;border-bottom:1px solid rgba(255,255,255,0.15);cursor:pointer;white-space:nowrap;user-select:none}tr.ch>th:first-child{padding-left:16px}tr.ch>th:hover{color:#00e676!important}tr.ch>th.s{color:#00e676!important}tr.ch>th.gend{padding-right:32px!important}td{padding:0 12px 0 0;height:26px;border:none;vertical-align:middle;white-space:nowrap;text-align:left;font-size:12px;color:#fff!important}td:first-child{padding-left:16px}td.gend{padding-right:32px!important}tr:hover>td{background:rgba(255,255,255,0.04)}tr.rhc>td:first-child{border-left:2px solid #00e676}tr.rxt>td:first-child{border-left:2px solid #ff1744}tr.rmo>td:first-child{border-left:2px solid transparent}tr.rbl>td:first-child{border-left:2px solid transparent}.cg{color:#00e676!important}.cr{color:#ff1744!important}.cw{color:#fff!important}.cdim{color:rgba(255,255,255,0.2)!important}.gears{display:inline-flex;gap:5px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}.don{background:#00e676}.dof{background:#ff1744}.dnu{background:rgba(255,255,255,0.15)}.msg{padding:40px 16px;color:rgba(255,255,255,0.25);font-size:12px}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:#13151a}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}.tip{position:relative;cursor:help}.tip::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:0;background:#0d0f13;border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;font-weight:400;line-height:1.6;padding:8px 10px;border-radius:4px;width:280px;white-space:pre-line;z-index:100;pointer-events:none;opacity:0;transition:opacity 0.15s;font-family:'Roboto Mono',monospace;letter-spacing:0}.tip:hover::after{opacity:1}.spec-link{font-size:11px;color:rgba(255,255,255,0.25);cursor:pointer;font-family:'Roboto Mono',monospace;letter-spacing:0.05em;user-select:none;transition:color 0.15s}.spec-link:hover{color:rgba(255,255,255,0.8)}.spec-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:center;justify-content:center}.spec-overlay.on{display:flex}.spec-modal{background:#0d0f13;border:1px solid rgba(255,255,255,0.2);width:min(900px,95vw);max-height:90vh;display:flex;flex-direction:column;font-family:'Roboto Mono',monospace}.spec-head{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.15);flex-shrink:0}.spec-head .t{font-size:13px;font-weight:600;color:#fff;letter-spacing:0.05em}.spec-head .m{font-size:11px;color:rgba(255,255,255,0.4);margin-left:auto}.spec-head .x{font-size:16px;color:rgba(255,255,255,0.5);cursor:pointer;padding:0 4px;user-select:none}.spec-head .x:hover{color:#fff}.spec-body{overflow-y:auto;padding:16px 20px;font-size:11px;line-height:1.55;color:#d8d8d8;white-space:pre-wrap;font-family:'Roboto Mono',monospace;word-wrap:break-word}.spec-body::-webkit-scrollbar{width:6px}.spec-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15)}</style></head><body>

<div class="top">
  <span class="logo">2H</span>
  <span class="ts" id="ts" style="color:rgba(255,255,255,0.4);font-size:11px">—</span>
  <span class="spec-link" onclick="openSpec()" title="System specification">[SPEC]</span>
  <select onchange="setSrc(this.value)">
    <option value="intraday">Live</option>
    <option value="eod">Daily</option>
  </select>
  <select onchange="setWL(this.value)">
    <option value="UK ETFS">UK</option>
    <option value="MAIN">US</option>
  </select>
  <select id="gsel" onchange="setGrp(this.value)">
    <option value="">All Groups</option>
  </select>
  <div class="sr"><input id="sr" placeholder="Search…" oninput="af()"></div>
</div>

<div class="sb">
  <div class="sp on"  id="sp-all"    onclick="setSig('ALL')">ALL —</div>
  <div class="sp tip" id="sp-hc"     onclick="setSig('HIGH CONVICTION')"
       data-tip="Tickers where the full physics stack qualifies.&#10;&#10;Formula: vol NORM or EXP + trend>8 + DNA in whitelist&#10;(16 codes e.g. 2221, 1231, 1130)&#10;&#10;These are the best setups in the universe right now.">CONVICTION —</div>
  <div class="sp tip" id="sp-mon"    onclick="setSig('MONITOR')"
       data-tip="Trend is up but physics isn't fully qualifying.&#10;&#10;Formula: trend>8, not in HC whitelist, not EXIT/EXT/BLOCK&#10;&#10;Worth watching. Often graduates to CONVICTION&#10;when one more piece of physics falls into place.">MONITOR —</div>
  <div class="sp tip" id="sp-ext"    onclick="setSig('EXTENDED')"
       data-tip="Price is stretched above its own recent range.&#10;&#10;Formula: price_z>1.5&#10;&#10;Don't chase. Wait for mean reversion or pullback.">EXTENDED —</div>
  <div class="sp tip" id="sp-exit"   onclick="setSig('EXIT')"
       data-tip="Momentum cascade has broken on both horizons.&#10;&#10;Formula: mom_d5<0 AND mom_d10<0&#10;&#10;Structural failure. Reduce or close.">EXIT —</div>
  <div class="sp tip" id="sp-blk"    onclick="setSig('BLOCK')"
       data-tip="Structural gate — not 'danger', just 'not on the menu'.&#10;&#10;Formula: trend<=8 OR vol=Compressed&#10;&#10;No entry conditions can be met here. Skip.">BLOCK —</div>
  <div class="sp tip" id="sp-tac"    onclick="setSig('TACTICAL')" style="color:#00e676"
       data-tip="Active hunting ground — best entry windows today.&#10;&#10;Formula: CONVICTION + timing in&#10;{Confirmed, Pause, Cooling, Ignition, Trend Hold,&#10;Melt Up, Bounce} + Div between -20 and +80&#10;&#10;Quality aligned with strength, entry timing clean.">TACTICAL —</div>
  <div class="sp tip" id="sp-decay"  onclick="setSig('DECAY')" style="color:#ff1744"
       data-tip="Quality much better than strength AND losing ground.&#10;&#10;Formula: Div < -35 AND rank_move < 0&#10;&#10;Setups deteriorating faster than price shows.&#10;Risk-management view.">DECAY —</div>
</div>

<div class="wrap"><table>
  <thead>
    <tr class="gh">
      <th class="blank" colspan="2"></th>
      <th colspan="4" class="gsep-lg gend">Signal</th>
      <th colspan="3" class="gsep hm gend">Trend</th>
      <th colspan="2" class="gsep gend">Velocity</th>
      <th colspan="2" class="gsep hm gend">Volatility</th>
      <th colspan="2" class="gsep hm gend">Volume</th>
      <th colspan="4" class="gsep hm gend">Price</th>
      <th colspan="4" class="gsep hm">Rank</th>
    </tr>
    <tr class="ch">
      <th style="min-width:70px;padding-left:16px" onclick="sb('symbol')">Ticker</th>
      <th class="hm" style="min-width:80px;max-width:100px" onclick="sb('group_name')">Group</th>
      <th class="gsep-lg tip" style="min-width:48px" onclick="sb('regime_id')"
          data-tip="4-digit physics fingerprint: V·T·A·P&#10;&#10;Formula: V×1000 + T×100 + A×10 + P&#10;&#10;V (vol):   0=Comp 1=Norm 2=Exp&#10;T (trend): 0=Bear(≤8) 1=Bull(8-80) 2=Monster(>80)&#10;A (accel): 0=Broken 1=Pausing 2=Aligned 3=Ignition&#10;P (price): 0=Falling 1=Normal 2=Extended&#10;&#10;Example: 2221 = Exp/Monster/Aligned/Normal">DNA</th>
      <th class="tip" style="min-width:80px" onclick="sb('regime_signal')"
          data-tip="Overall verdict from DNA.&#10;&#10;CONVICTION: DNA in whitelist + trend>8 + vol NORM/EXP&#10;MONITOR:    trend>8 but not on whitelist&#10;EXTENDED:   price_z>1.5&#10;EXIT:       mom_d5<0 AND mom_d10<0&#10;BLOCK:      trend<=8 OR vol=Comp">Signal</th>
      <th class="gend tip" style="min-width:96px" onclick="sb('entry_timing')"
          data-tip="What the ticker is DOING right now.&#10;&#10;Green = entry-eligible&#10;White = hold/wait/neutral&#10;Red   = danger&#10;&#10;Confirmed:  all gears+, price normal&#10;Cooling:    pullback in a Monster trend (green)&#10;Ignition:   fresh turn, trend_d5>=2 (green)&#10;Melt Up:    stretched + low vol drift (green)&#10;Bounce:     dead cat + high vol rebound (green)&#10;Trend Hold: near highs, mild pullback (white)&#10;Pause:      paused mid-move (white)&#10;Wait:       cooling but still elevated (white)&#10;Climax:     stretched + volume surge (red)&#10;Trend Fade: all+, but trend turning down (red)&#10;Ext Risk:   all+, getting stretched (red)&#10;Extended:   price_z>1.25 (red)&#10;Weak Dip:   structural dip, not a buy (red)&#10;Dead Cat:   low-vol failed bounce (red)&#10;Exit:       both horizons broken (red)">Timing</th>
      <th class="hm tip" style="min-width:80px"
          data-tip="What the DAILY chart says right now.&#10;&#10;Both agree danger = real, act (red)&#10;Live danger + Daily calm = intraday noise (amber)&#10;Both calm = trust the live read">EOD</th>
      <th class="gsep hm tip" style="min-width:50px" onclick="sb('trend')"
          data-tip="63-bar trend score.&#10;&#10;Formula: composite of 12 methods, scale -100 to +100&#10;&#10;Green:  >8  (positive trend)&#10;Red:    <-8 (negative trend)&#10;Monster: >80 (near-unanimous uptrend)">Trend</th>
      <th class="hm tip" style="min-width:50px" onclick="sb('momentum')"
          data-tip="21-bar momentum score (faster than trend).&#10;&#10;Formula: same 12 methods, 21-bar lookback&#10;&#10;Green:  >8&#10;Red:    <-8&#10;Compare to Trend to see acceleration vs structure.">Trade</th>
      <th class="hm gend tip" style="min-width:24px" onclick="sb('t_digit')"
          data-tip="Trend digit of DNA.&#10;&#10;Formula: 0 if trend<=8 / 1 if 8<trend<=80 / 2 if trend>80">T</th>
      <th class="gsep tip" style="min-width:56px" onclick="sb('mom_d5')"
          data-tip="Three-gear read on velocity.&#10;&#10;Dot 1: mom_d5  — 5-bar momentum change&#10;Dot 2: mom_d10 — 10-bar momentum change&#10;Dot 3: trend_d5 — 5-bar trend change&#10;&#10;Green=positive Red=negative&#10;All green = full throttle">Gears</th>
      <th class="gend tip" style="min-width:24px" onclick="sb('a_digit')"
          data-tip="Acceleration digit of DNA.&#10;&#10;0 = Broken / Dead Cat (mom_d5<0 AND mom_d10<0, or weak bounce)&#10;1 = Pausing    (mom_d5<0 AND mom_d10>=0)&#10;2 = Aligned    (mom_d5>=0 AND mom_d10>=0)&#10;3 = Ignition   (mom_d5>=0 AND mom_d10<0 AND trend_d5>=0 AND trend>8)">A</th>
      <th class="gsep hm tip" style="min-width:76px" onclick="sb('vol_regime')"
          data-tip="ATR-based volatility regime.&#10;&#10;Formula: atr vs 20-day average&#10;&#10;Compressed: blocks all entries (no room to move)&#10;Normal:     standard conditions&#10;Expanded:   high vol, often strong trends">Regime</th>
      <th class="hm gend tip" style="min-width:24px" onclick="sb('v_digit')"
          data-tip="Volatility digit of DNA.&#10;&#10;0=Compressed 1=Normal 2=Expanded">V</th>
      <th class="gsep hm tip" style="min-width:56px" onclick="sb('rel_vol_20d')"
          data-tip="Relative volume — today vs this ticker's own 20-day avg.&#10;&#10;Formula: today's volume / AVG(volume last 20 days)&#10;&#10;Bold: >=1.3 (spike — real participation)&#10;White: 0.8 – 1.3 (normal day)&#10;Dim:   <0.8 (quiet / no interest)&#10;&#10;Caution: Extremes (>=10x) on thin/UK ETFs often&#10;represent single-block noise, not institutional flow.&#10;Cross-reference Vol ROC for persistence.&#10;&#10;Contextual column — bold/dim modulate attention.&#10;Used to split EXT RISK into CLIMAX/MELT UP&#10;and DEAD CAT into BOUNCE.">Rel Vol</th>
      <th class="hm gend tip" style="min-width:56px" onclick="sb('vol_roc_3d')"
          data-tip="Volume rate-of-change (3-day).&#10;&#10;Formula: today's rel_vol − AVG(rel_vol last 3 days)&#10;&#10;Positive: volume accelerating&#10;Negative: volume decelerating&#10;&#10;Diagnostic column — not coloured.&#10;Read alongside Rel Vol + Timing state.">Vol ROC</th>
      <th class="gsep hm tip" style="min-width:52px" onclick="sb('price_d5_z')"
          data-tip="How stretched price is vs its own recent history.&#10;&#10;Formula: 5d return z-score vs 60d distribution&#10;&#10;White: <0.85 (normal)&#10;Red:   >=0.85 (caution zone / extension)&#10;Red:   >1.25  (hard block: Extended timing)">Price Z</th>
      <th class="hm tip" style="min-width:44px" onclick="sb('range_pos_20d')"
          data-tip="Where price sits in its 20-day high-low range.&#10;&#10;Formula: (close - 20d low) / (20d high - 20d low)&#10;0 = at 20d low   1 = at 20d high&#10;&#10;White: <=0.75&#10;Red:   >0.75 (near highs, extension risk)">R20</th>
      <th class="hm tip" style="min-width:54px" onclick="sb('perf_1d')"
          data-tip="Today's return.&#10;&#10;Formula: (close - prev_close) / prev_close&#10;&#10;Green: >0  Red: <0">1D%</th>
      <th class="hm gend tip" style="min-width:54px" onclick="sb('perf_5d')"
          data-tip="5-day return.&#10;&#10;Formula: (close - close_5d_ago) / close_5d_ago&#10;&#10;Green: >0  Red: <0">5D%</th>
      <th class="gsep hm tip" style="min-width:40px" onclick="sb('rank')"
          data-tip="Raw strength rank within watchlist.&#10;&#10;Formula: rank by (trend*0.5 + momentum*0.5)&#10;Rank 1 = strongest ticker in UK or US universe">Rank</th>
      <th class="hm tip" style="min-width:44px" onclick="sb('rank_move')"
          data-tip="Change in rank vs previous session.&#10;&#10;Green: + (gaining positions)&#10;Red:   - (losing positions)">R Mv</th>
      <th class="hm tip" style="min-width:40px" onclick="sb('q_rank')"
          data-tip="Quality rank — best SETUP, not best strength.&#10;&#10;Formula: regime tier → timing tier → raw rank&#10;Lower is better. Q Rank 1 = best setup today.">Q Rk</th>
      <th class="hm tip" style="min-width:40px" onclick="sb('div')"
          data-tip="Efficiency score: Rank − Q Rank.&#10;&#10;Positive: quality ahead of raw strength (clean setup)&#10;Negative: raw strength ahead of quality (momentum only)&#10;&#10;Green: -20 to +80  (healthy range)&#10;Red:   outside that range">Div</th>
    </tr>
  </thead>
  <tbody id="tb"><tr><td colspan="23" class="msg">Loading…</td></tr></tbody>
</table></div>

<script>
const SURL='https://pzskvslhfaituzyukasl.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6c2t2c2xoZmFpdHV6eXVrYXNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNzQyNTAsImV4cCI6MjA3OTY1MDI1MH0.FEZTIIQ4zgdb7uswf70XZI9Ph6ykSeDkfxooIcRIOMw';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
const COLS='symbol,name,group_name,watchlist,trend,momentum,mom_d5,mom_d10,trend_d5,price_d5_z,range_pos_20d,perf_1d,perf_5d,rank,rank_move,vol_regime,v_digit,t_digit,a_digit,p_digit,regime_id,regime_signal,entry_timing,q_rank,div,rel_vol_20d,vol_roc_3d';

let all=[],eodMap={},filt=[],sc='q_rank',sd=1,sig='ALL',src='intraday',wl='UK ETFS',grp='';

const TIER={'HIGH CONVICTION':1,'MONITOR':2,'EXTENDED':3,'EXIT':4,'BLOCK':5};
const TIMING_TIER={
  'BLOCK':0,'COOLING':1,'IGNITION':2,'MELT UP':3,'BOUNCE':4,'CONFIRMED':5,
  'TREND HOLD':6,'PAUSE':7,'CLIMAX':8,'EXT RISK':9,
  'EXTENDED':10,'TREND FADE':11,'WEAK DIP':12,'DEAD CAT':13,'WAIT':14,'EXIT':15
};
const tsort=r=>(TIER[r.regime_signal]||6)*100000+(TIMING_TIER[r.entry_timing]||5)*1000+(r.rank&&r.rank<900?r.rank:9999);

// Colour logic
const TIMING_GOOD = new Set(['COOLING','IGNITION','MELT UP','BOUNCE']);
const TIMING_BAD  = new Set(['EXIT','DEAD CAT','WEAK DIP','EXT RISK','EXTENDED','TREND FADE','CLIMAX']);

const TACTICAL_TIMINGS = new Set(['CONFIRMED','PAUSE','COOLING','IGNITION','TREND HOLD','MELT UP','BOUNCE']);
const DANGER_TIMINGS   = new Set(['EXIT','DEAD CAT','WEAK DIP','CLIMAX']);
const GOOD_TIMINGS     = new Set(['CONFIRMED','COOLING','IGNITION','TREND HOLD','PAUSE','MELT UP','BOUNCE']);

async function load(){
  const v=src==='intraday'?'r_universe_live':'r_universe';
  try{
    const[res,eodRes]=await Promise.all([
      fetch(`${SURL}/rest/v1/${v}?select=${COLS}&limit=300`,{headers:H}),
      fetch(`${SURL}/rest/v1/r_universe?select=symbol,entry_timing,regime_signal&limit=300`,{headers:H})
    ]);
    if(!res.ok)throw new Error(res.status);
    all=await res.json();
    if(eodRes.ok){
      const d=await eodRes.json();
      eodMap={};
      d.forEach(r=>{eodMap[r.symbol]={timing:r.entry_timing,signal:r.regime_signal};});
    }
    const tsEl=document.getElementById('ts');
    if(tsEl&&all.length){
      if(src==='intraday'&&all[0].updated_at)
        tsEl.textContent=new Date(all[0].updated_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      else if(all[0].bar_date)
        tsEl.textContent=all[0].bar_date;
    }
    buildGroups();counts();af();
  }catch(e){
    document.getElementById('tb').innerHTML=`<tr><td colspan="23" class="msg">Error — ${e.message}</td></tr>`;
  }
}

function setSrc(s){src=s;load();}
function setWL(w){wl=w;buildGroups();counts();af();}
function setGrp(g){grp=g;counts();af();}

function buildGroups(){
  const b=wl?all.filter(r=>r.watchlist===wl||r.watchlist==='BOTH'):all;
  const gs=[...new Set(b.map(r=>r.group_name).filter(Boolean))].sort();
  const sel=document.getElementById('gsel');
  const cur=sel.value;
  sel.innerHTML='<option value="">All Groups</option>'+gs.map(g=>`<option value="${g}"${g===cur?' selected':''}>${g}</option>`).join('');
  if(!gs.includes(grp)){sel.value='';grp='';}
}

function base(){
  return all.filter(r=>{
    if(wl&&r.watchlist!==wl&&r.watchlist!=='BOTH')return false;
    if(grp&&r.group_name!==grp)return false;
    return true;
  });
}

function counts(){
  const b=base();
  const c={'HIGH CONVICTION':0,'MONITOR':0,'EXTENDED':0,'EXIT':0,'BLOCK':0};
  b.forEach(r=>{if(c[r.regime_signal]!=null)c[r.regime_signal]++;});
  const tactical=b.filter(r=>
    r.regime_signal==='HIGH CONVICTION'&&
    TACTICAL_TIMINGS.has(r.entry_timing)&&
    r.div!=null&&r.div>=-20&&r.div<=80
  ).length;
  const decay=b.filter(r=>
    r.div!=null&&r.div<-35&&r.rank_move!=null&&r.rank_move<0
  ).length;
  [
    ['sp-all',   b.length,             'ALL'],
    ['sp-hc',    c['HIGH CONVICTION'], 'CONVICTION'],
    ['sp-mon',   c['MONITOR'],         'MONITOR'],
    ['sp-ext',   c['EXTENDED'],        'EXTENDED'],
    ['sp-exit',  c['EXIT'],            'EXIT'],
    ['sp-blk',   c['BLOCK'],           'BLOCK'],
    ['sp-tac',   tactical,             'TACTICAL'],
    ['sp-decay', decay,                'DECAY']
  ].forEach(([id,n,l])=>{const el=document.getElementById(id);if(el)el.textContent=l+' '+n;});
}

const SIG_ID={'ALL':'sp-all','HIGH CONVICTION':'sp-hc','MONITOR':'sp-mon','EXTENDED':'sp-ext','EXIT':'sp-exit','BLOCK':'sp-blk','TACTICAL':'sp-tac','DECAY':'sp-decay'};
const SIG_CLS={'ALL':'on','HIGH CONVICTION':'on ghc','MONITOR':'on gmo','EXTENDED':'on gxt','EXIT':'on gxt','BLOCK':'on','TACTICAL':'on ghc','DECAY':'on gxt'};
const HAS_TIP=new Set(['sp-hc','sp-mon','sp-ext','sp-exit','sp-blk','sp-tac','sp-decay']);

function setSig(v){
  sig=v;
  Object.values(SIG_ID).forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.className='sp'+(HAS_TIP.has(id)?' tip':'');
  });
  const id=SIG_ID[v];
  if(id){
    const el=document.getElementById(id);
    if(el)el.className='sp '+(SIG_CLS[v]||'on')+(HAS_TIP.has(id)?' tip':'');
  }
  af();
}

function af(){
  const s=document.getElementById('sr').value.toLowerCase();
  filt=base().filter(r=>{
    if(sig==='TACTICAL'){
      if(r.regime_signal!=='HIGH CONVICTION')return false;
      if(!TACTICAL_TIMINGS.has(r.entry_timing))return false;
      if(r.div==null||r.div<-20||r.div>80)return false;
    }else if(sig==='DECAY'){
      if(r.div==null||r.div>=-35)return false;
      if(r.rank_move==null||r.rank_move>=0)return false;
    }else if(sig!=='ALL'){
      if(r.regime_signal!==sig)return false;
    }
    if(s&&!(r.symbol||'').toLowerCase().includes(s)&&!(r.name||'').toLowerCase().includes(s)&&!(r.group_name||'').toLowerCase().includes(s))return false;
    return true;
  });
  sort();render();
}

function sb(c){
  if(sc===c)sd*=-1;else{sc=c;sd=c==='_tier'?1:-1;}
  document.querySelectorAll('tr.ch th').forEach(t=>t.classList.remove('s'));
  event?.target?.classList.add('s');
  sort();render();
}

function sort(){
  filt.sort((a,b)=>{
    if(sc==='_tier')return tsort(a)-tsort(b);
    let av=a[sc],bv=b[sc];
    if(av==null)av=sd>0?Infinity:-Infinity;
    if(bv==null)bv=sd>0?Infinity:-Infinity;
    if(typeof av==='string')return av.localeCompare(bv)*sd;
    return(av-bv)*sd;
  });
}

const mc=v=>{if(v==null||isNaN(v))return'cw';const f=parseFloat(v);return f>8?'cg':f<-8?'cr':'cw';};

const dot=(v,ac)=>{
  if(v==null||isNaN(parseFloat(v)))return'<span class="dot dnu"></span>';
  return`<span class="dot ${parseFloat(v)>=0?'don':'dof'}"></span>`;
};

const num=(v,d=1)=>(v==null||isNaN(v))?'<span class="cdim">—</span>':parseFloat(v).toFixed(d);

const pct=v=>{
  if(v==null||isNaN(v))return'<span class="cdim">—</span>';
  const f=parseFloat(v);
  return`<span class="${f>0?'cg':f<0?'cr':'cw'}">${f>=0?'+':''}${f.toFixed(2)}%</span>`;
};

const rmv=v=>{
  if(v==null||v===''||v===undefined)return'<span class="cdim">—</span>';
  const i=parseInt(v);
  if(isNaN(i)||i===0)return'<span class="cdim">—</span>';
  return`<span style="color:${i>0?'#00e676':'#ff1744'}">${i>0?'+':''}${i}</span>`;
};

// Rel vol: bold white if >=1.3 (spike — attention), dim if <0.8 (quiet), white otherwise
// Red/green reserved for verdicts. Rel Vol is a contextual column.
const relvol=v=>{
  if(v==null||isNaN(v))return'<span class="cdim">—</span>';
  const f=parseFloat(v);
  if(f>=1.3)return`<span style="color:#fff;font-weight:700">${f.toFixed(2)}×</span>`;
  if(f<0.8) return`<span style="color:rgba(255,255,255,0.35)">${f.toFixed(2)}×</span>`;
  return`<span class="cw">${f.toFixed(2)}×</span>`;
};

// Vol ROC: diagnostic only — white always, no directional colour
const volroc=v=>{
  if(v==null||isNaN(v))return'<span class="cdim">—</span>';
  const f=parseFloat(v);
  return`<span class="cw">${f>=0?'+':''}${f.toFixed(2)}</span>`;
};

const VL={'EXP':'Expanded','NORM':'Normal','COMP':'Compressed'};
const VC={'COMP':'cr','EXP':'cw','NORM':'cw'};
const RC={'HIGH CONVICTION':'rhc','MONITOR':'rmo','EXTENDED':'rmo','EXIT':'rxt','BLOCK':'rbl'};

function pillHtml(sg){
  if(sg==='EXIT')return'<span style="color:#ff1744">Exit</span>';
  if(sg==='HIGH CONVICTION')return'<span style="color:#00e676">Conviction</span>';
  if(sg==='MONITOR'||sg==='EXTENDED')return'<span style="color:#fff">Monitor</span>';
  return'<span style="color:#fff">Block</span>';
}

function timingColour(t){
  if(TIMING_GOOD.has(t))return'color:#00e676';
  if(TIMING_BAD.has(t)) return'color:#ff1744';
  return'color:#fff';
}

const TIMING_LABEL={
  'CONFIRMED':'Confirmed','COOLING':'Cooling','PAUSE':'Pause',
  'IGNITION':'Ignition','TREND HOLD':'Trend Hold',
  'MELT UP':'Melt Up','BOUNCE':'Bounce','CLIMAX':'Climax',
  'TREND FADE':'Trend Fade','WEAK DIP':'Weak Dip','EXT RISK':'Ext Risk',
  'EXTENDED':'Extended','DEAD CAT':'Dead Cat','WAIT':'Wait',
  'EXIT':'Exit','BLOCK':'Block',
};

function render(){
  const tb=document.getElementById('tb');
  if(!filt.length){tb.innerHTML='<tr><td colspan="23" class="msg">No results</td></tr>';return;}
  tb.innerHTML=filt.map(r=>{
    const sg=r.regime_signal||'MONITOR';
    const dna=String(r.regime_id||0).padStart(4,'0');
    const tim=r.entry_timing||'WAIT';
    const timLbl=TIMING_LABEL[tim]||tim;
    const timSty=timingColour(tim);
    const pzAbs=Math.abs(parseFloat(r.price_d5_z)||0);
    const rnk=r.rank&&r.rank<900?r.rank:'<span class="cdim">—</span>';
    const r20=parseFloat(r.range_pos_20d)||0;

    const eod=eodMap[r.symbol];
    const eodTim=eod?eod.timing:'';
    const eodLbl=eodTim?(TIMING_LABEL[eodTim]||eodTim):'—';
    const isConflict=DANGER_TIMINGS.has(tim)&&GOOD_TIMINGS.has(eodTim);
    const isAgreed=DANGER_TIMINGS.has(tim)&&DANGER_TIMINGS.has(eodTim);
    const eodStyle = isConflict ? 'color:#ffaa00'
                   : isAgreed   ? 'color:#ff1744'
                   : timingColour(eodTim);
    const eodHtml=eodTim?`<span style="${eodStyle}">${eodLbl}</span>`:'<span class="cdim">—</span>';

    const pzStyle = pzAbs>=0.85 ? 'color:#ff1744' : 'color:#fff';
    const r20Style = r20>0.75 ? 'color:#ff1744' : 'color:#fff';
    const divVal = r.div;
    const divStyle = (divVal==null) ? 'color:rgba(255,255,255,0.2)'
                    : (divVal<-20||divVal>80) ? 'color:#ff1744'
                    : 'color:#00e676';

    return`<tr class="${RC[sg]||'rmo'}">`+
      `<td title="${(r.name||'').replace(/"/g,'&quot;')}"><span style="color:#fff;font-weight:600">${r.symbol}</span></td>`+
      `<td class="hm"><span style="color:#888;max-width:100px;overflow:hidden;text-overflow:ellipsis;display:block;white-space:nowrap;font-size:11px">${r.group_name||''}</span></td>`+
      `<td class="gsep-lg"><span style="color:#fff;font-weight:500">${dna}</span></td>`+
      `<td>${pillHtml(sg)}</td>`+
      `<td><span style="${timSty}">${timLbl}</span></td>`+
      `<td class="hm gend">${eodHtml}</td>`+
      `<td class="gsep hm"><span class="${mc(r.trend)}">${num(r.trend)}</span></td>`+
      `<td class="hm"><span class="${mc(r.momentum)}">${num(r.momentum)}</span></td>`+
      `<td class="hm gend"><span class="cw">${r.t_digit!=null?r.t_digit:'—'}</span></td>`+
      `<td class="gsep"><span class="gears">${dot(r.mom_d5)}${dot(r.mom_d10)}${dot(r.trend_d5)}</span></td>`+
      `<td class="gend"><span class="cw">${r.a_digit!=null?r.a_digit:'—'}</span></td>`+
      `<td class="gsep hm"><span class="${VC[r.vol_regime]||'cw'}">${VL[r.vol_regime]||r.vol_regime||'—'}</span></td>`+
      `<td class="hm gend"><span class="cw">${r.v_digit!=null?r.v_digit:'—'}</span></td>`+
      `<td class="gsep hm">${relvol(r.rel_vol_20d)}</td>`+
      `<td class="hm gend">${volroc(r.vol_roc_3d)}</td>`+
      `<td class="gsep hm"><span style="${pzStyle}">${num(r.price_d5_z,2)}</span></td>`+
      `<td class="hm"><span style="${r20Style}">${r.range_pos_20d!=null?r20.toFixed(2):'—'}</span></td>`+
      `<td class="hm">${pct(r.perf_1d)}</td>`+
      `<td class="hm gend">${pct(r.perf_5d)}</td>`+
      `<td class="gsep hm"><span class="cw">${rnk}</span></td>`+
      `<td class="hm">${rmv(r.rank_move)}</td>`+
      `<td class="hm"><span class="cw">${r.q_rank||'—'}</span></td>`+
      `<td class="hm"><span style="${divStyle}">${divVal!=null?(divVal>0?'+':'')+divVal:'—'}</span></td>`+
    `</tr>`;
  }).join('');
}

load();
setInterval(load,3*60*1000);

// ---------- SPEC modal ----------
let specLoaded=false,specContent='',specVersion=null,specCreatedAt=null;

async function openSpec(){
  const overlay=document.getElementById('specOverlay');
  overlay.classList.add('on');
  if(!specLoaded){
    const body=document.getElementById('specBody');
    body.textContent='Loading…';
    try{
      const r=await fetch(`${SURL}/rest/v1/system_spec_r?select=version,content,created_at&is_current=eq.true&limit=1`,{headers:H});
      if(!r.ok)throw new Error(r.status);
      const d=await r.json();
      if(!d.length)throw new Error('no current spec');
      specContent=d[0].content;
      specVersion=d[0].version;
      specCreatedAt=d[0].created_at;
      specLoaded=true;
    }catch(e){
      body.textContent=`Error loading spec: ${e.message}`;
      return;
    }
    const head=document.getElementById('specHead');
    const d=new Date(specCreatedAt);
    const ds=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    head.textContent=`v${specVersion} · ${ds}`;
    body.textContent=specContent;
  }
}

function closeSpec(){
  document.getElementById('specOverlay').classList.remove('on');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSpec();
});
</script>

<div class="spec-overlay" id="specOverlay" onclick="if(event.target===this)closeSpec()">
  <div class="spec-modal">
    <div class="spec-head">
      <span class="t">2H SYSTEM SPEC</span>
      <span class="m" id="specHead">—</span>
      <span class="x" onclick="closeSpec()" title="Close (Esc)">×</span>
    </div>
    <div class="spec-body" id="specBody">Loading…</div>
  </div>
</div>
